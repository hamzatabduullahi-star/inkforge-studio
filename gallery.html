<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkForge – Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <header class="header" id="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">InkForge</a>
            </div>
            <nav class="nav">
                <a href="gallery.html" class="active">Gallery</a>
                <a href="booking.html" class="nav-cta">Book a session</a>
            </nav>
            <button class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <div class="mobile-nav" id="mobileNav">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="booking.html">Book a session</a>
        <a href="aftercare.html">Aftercare</a>
    </div>

    <section class="page-hero fade-in">
        <div class="container">
            <h1>Our Work</h1>
            <p class="page-sub">A collection of recent tattoos —<br />across all our styles.</p>
        </div>
    </section>

    <section class="gallery-page fade-in">
        <div class="container">
            <div class="gallery-grid">
                <div class="gallery-item"><img src="http://i.imgur.com/hQxZCsB.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/nwTkZMX.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/BLZsXFX.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/MRcrtQK.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/GqqEWvz.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/jXac7Iw.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/IL0blry.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/R7qy5AL.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/m8RmHdw.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/Iq13IBi.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/v1cLfHA.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/Y5eXiXE.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/TB8TkTT.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/K17eEd5.jpeg" alt="Tattoo" /></div>
                <div class="gallery-item"><img src="http://i.imgur.com/WeMTKfC.jpeg" alt="Tattoo" /></div>
            </div>
        </div>
    </section>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <img id="lightboxImage" src="" alt="Tattoo preview" />
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 InkForge. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger');
        const mobileNav = document.getElementById('mobileNav');
        const body = document.body;

        hamburger.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            mobileNav.classList.toggle('active');
            body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
        });

        mobileNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function() {
                hamburger.classList.remove('active');
                mobileNav.classList.remove('active');
                body.style.overflow = '';
            });
        });

        document.addEventListener('click', function(e) {
            if (mobileNav.classList.contains('active') &&
                !mobileNav.contains(e.target) &&
                !hamburger.contains(e.target)) {
                hamburger.classList.remove('active');
                mobileNav.classList.remove('active');
                body.style.overflow = '';
            }
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxClose = document.getElementById('lightboxClose');

        document.querySelectorAll('.gallery-item').forEach(item => {
            item.addEventListener('click', function() {
                const img = this.querySelector('img');
                if (img) {
                    lightboxImage.src = img.src;
                    lightboxImage.alt = img.alt || 'Tattoo preview';
                    lightbox.classList.add('active');
                    body.style.overflow = 'hidden';
                }
            });
        });

        function closeLightbox() {
            lightbox.classList.remove('active');
            body.style.overflow = '';
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });

        const fadeElements = document.querySelectorAll('.fade-in');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.15 });
        fadeElements.forEach(el => observer.observe(el));

        const header = document.getElementById('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
